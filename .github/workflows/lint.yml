name: CI

on:
  push:
    branches:
      - master
      - private
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, test, verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # canvas is the only native dependency and is not needed for lint/tests:
      # installing with --ignore-scripts keeps these jobs fast and portable.
      - name: Install dependencies (skip native build scripts)
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run prettier

      - name: Unit and regression tests
        run: npm test

      - name: Command registry verification
        run: npm run verify:commands

      - name: Circular dependency check
        run: npm run checkCircular

  native-install:
    name: Clean install with native builds (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # System libraries required to compile canvas from source
      - name: Install canvas build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: npm ci (acceptance test for a clean checkout)
        run: npm ci

      - name: Smoke test the canvas binding
        run: node -e "const {createCanvas}=require('canvas');const c=createCanvas(10,10);c.getContext('2d').fillRect(0,0,5,5);console.log('canvas ok')"

  security-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    # The audit is informational: it must never silently pass, but it also must
    # not block a merge while documented advisories are still open.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev

      - name: Lockfile consistency
        run: npm ci --ignore-scripts --dry-run
