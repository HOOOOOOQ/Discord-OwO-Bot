# Local / small-deployment stack: the bot and nothing else.
#
# The bot only needs a Discord token and a MongoDB connection string.
# Use MongoDB Atlas (free tier) — it works with this file unchanged — or start a
# local MongoDB container by uncommenting the `mongo` service below.
#
#   cp .env.example .env   # fill in BOT_TOKEN and MONGODB_URI
#   docker compose up -d
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    # The sharder forks up to CLUSTERS processes; give it time to shut down cleanly
    stop_grace_period: 30s

  # Optional: local MongoDB instead of Atlas. Then set in .env
  #   MONGODB_URI=mongodb://mongo:27017/ocean
  # (a single container has no transactions; Atlas does, and the bot prefers it)
  # mongo:
  #   image: mongo:7
  #   restart: unless-stopped
  #   volumes:
  #     - mongo-data:/data/db
  #   healthcheck:
  #     test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
